# Late concat fusion baseline configuration
batch_size: 4
sequence_length: 32
device: cpu

vib_in_channels: 2
vib_lengths: [1024, 2560]
vib_cnn_channels: [64, 64, 64]
vib_kernel_sizes: [3, 3, 3]
vib_pool_sizes: [2, 2, 2]
vib_norm_type: batch
vib_activation: relu

temp_representation: feature_vector
temp_in_features: 7
temp_history_length: 64
temp_encoder_type: mlp
temp_hidden_sizes: [64, 64]
temp_norm_type: batch
temp_activation: relu

attn_num_heads: 4
attn_dropout: 0.1
attn_proj_dropout: 0.1

fusion_type: weighted_sum
d_model: 128
scale_weight_type: global

temporal_type: lstm
temporal_hidden_size: 128
temporal_num_layers: 2
temporal_dropout: 0.1
bidirectional: false

regression_hidden: [128, 64]
regression_dropout: 0.1
non_negative: true

return_aux: false